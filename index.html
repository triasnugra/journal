<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Trading Crypto</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS untuk Export Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-200 font-sans min-h-screen">

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="flex flex-col items-center justify-center min-h-screen">
        <div class="bg-gray-800 p-8 rounded-lg shadow-lg text-center max-w-sm w-full mx-4 border border-gray-750">
            <h1 class="text-2xl font-bold text-blue-400 mb-2">Jurnal Trading</h1>
            <p class="text-gray-400 mb-6 text-sm">Sistem Terkunci. Silakan login untuk mengakses data Anda.</p>
            <button onclick="loginGoogle()" class="w-full bg-white text-gray-900 font-bold py-3 px-4 rounded flex items-center justify-center gap-3 hover:bg-gray-200 transition">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                Login dengan Google
            </button>
        </div>
    </div>

    <!-- APLIKASI UTAMA (Disembunyikan sampai user login) -->
    <div id="mainApp" class="max-w-7xl mx-auto p-4 md:p-8 hidden">
        
        <!-- Header & User Info -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h1 class="text-3xl font-bold text-blue-400">📊 Jurnal Trading Crypto</h1>
            <div class="flex items-center gap-4 bg-gray-800 py-2 px-4 rounded-full border border-gray-700">
                <span id="userNameDisplay" class="text-sm font-semibold text-gray-300">Memuat user...</span>
                <button onclick="logoutGoogle()" class="text-xs bg-red-600 hover:bg-red-700 text-white py-1 px-3 rounded-full transition font-bold">Logout</button>
            </div>
        </div>

        <!-- Form Input -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-8 border border-gray-750">
            <h2 class="text-xl font-semibold mb-4 text-white" id="formTitle">Tambah Analisis Baru</h2>
            <form id="journalForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="hidden" id="editId">
                
                <div>
                    <label class="block text-sm mb-1">Mesin Analisis</label>
                    <select id="mesin" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600 focus:border-blue-500 outline-none" required>
                        <option value="Mesin 1">Mesin 1</option>
                        <option value="Mesin 2">Mesin 2</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm mb-1">Coin</label>
                    <input type="text" id="coin" placeholder="Cth: BTC/USDT" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600 uppercase" required>
                </div>

                <div>
                    <label class="block text-sm mb-1">Tanggal Analisis</label>
                    <input type="date" id="tglAnalisis" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600" required>
                </div>

                <div>
                    <label class="block text-sm mb-1">Jam Analisis</label>
                    <input type="time" id="jamAnalisis" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600" required>
                </div>

                <div>
                    <label class="block text-sm mb-1">Target Entry / Limit</label>
                    <input type="number" step="any" id="entry" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600" required>
                </div>

                <div>
                    <label class="block text-sm mb-1">Target TP (Take Profit)</label>
                    <input type="number" step="any" id="tp" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600" required>
                </div>

                <div>
                    <label class="block text-sm mb-1">Target SL (Stop Loss)</label>
                    <input type="number" step="any" id="sl" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600" required>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm mb-1">Alasan Entry</label>
                    <input type="text" id="alasan" placeholder="Cth: Breakout resistance di H4..." class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600" required>
                </div>

                <!-- Bagian Update Hasil -->
                <div class="mt-4 md:col-span-3 border-t border-gray-700 pt-4">
                    <p class="text-sm text-yellow-400 mb-3">📍 *Isi bagian ini saat hasil trade sudah keluar*</p>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm mb-1">Tanggal Hasil (Opsional)</label>
                            <input type="date" id="tglHasil" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600">
                        </div>
                        
                        <div>
                            <label class="block text-sm mb-1">Jam Hasil (Opsional)</label>
                            <input type="time" id="jamHasil" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600">
                        </div>

                        <div>
                            <label class="block text-sm mb-1">Status Trade</label>
                            <select id="status" class="w-full bg-gray-700 rounded p-2 text-white border border-gray-600">
                                <option value="Pending">⏳ Pending</option>
                                <option value="Win">✅ Win (TP Hit)</option>
                                <option value="Lose">❌ Lose (SL Hit)</option>
                                <option value="Cancel">🚫 Cancelled</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="md:col-span-3 flex gap-2 mt-2">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition">Simpan Jurnal</button>
                    <button type="button" onclick="resetForm()" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded transition hidden" id="btnCancel">Batal Edit</button>
                </div>
            </form>
        </div>

        <!-- Tabel Riwayat -->
        <div class="bg-gray-800 rounded-lg shadow-lg overflow-x-auto border border-gray-750">
            <div class="flex justify-between items-center p-4 border-b border-gray-700">
                <h2 class="text-xl font-semibold text-white">Riwayat Trading</h2>
                <button onclick="exportExcel()" class="bg-green-600 hover:bg-green-700 text-white text-sm font-bold py-2 px-4 rounded flex items-center gap-2">
                    📥 Download (Excel)
                </button>
            </div>
            
            <table class="w-full text-sm text-left">
                <thead class="text-xs text-gray-400 uppercase bg-gray-700">
                    <tr>
                        <th class="px-4 py-3">Waktu Analisis</th>
                        <th class="px-4 py-3">Mesin</th>
                        <th class="px-4 py-3">Coin</th>
                        <th class="px-4 py-3">Entry</th>
                        <th class="px-4 py-3">TP</th>
                        <th class="px-4 py-3">SL</th>
                        <th class="px-4 py-3">Alasan</th>
                        <th class="px-4 py-3">Waktu Hasil</th>
                        <th class="px-4 py-3">Status</th>
                        <th class="px-4 py-3 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data dari Firebase akan muncul di sini -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDK (Menambahkan fitur Auth & Config Anda) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // =========================================================
        // CONFIG FIREBASE MILIK ANDA (ASGRATRADINGJOURNAL)
        // =========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBG8UeNhLCGYcPSFkdLyvqZw8kIEaWfjHQ",
            authDomain: "asgratradingjournal.firebaseapp.com",
            projectId: "asgratradingjournal",
            storageBucket: "asgratradingjournal.firebasestorage.app",
            messagingSenderId: "511570177186",
            appId: "1:511570177186:web:326f72e1905324ac1b7bfb",
            measurementId: "G-XB57GJYFPC"
        };
        // =========================================================

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let globalTrades = [];

        // --- SISTEM AUTENTIKASI ---
        
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('userNameDisplay').innerText = `Halo, ${user.displayName}`;
                
                loadData();
            } else {
                document.getElementById('loginPage').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        window.loginGoogle = () => {
            signInWithPopup(auth, provider).catch((error) => {
                alert("Gagal login: " + error.message);
            });
        };

        window.logoutGoogle = () => {
            signOut(auth).then(() => {
                globalTrades = []; 
                document.getElementById('tableBody').innerHTML = ''; 
            });
        };

        // --- SISTEM DATABASE ---

        async function loadData() {
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="10" class="text-center py-4 text-gray-400">Loading data dari cloud... ⏳</td></tr>`;
            
            try {
                const q = query(collection(db, "trades"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                globalTrades = [];
                let html = '';

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    globalTrades.push({ id, ...data });

                    let statusBadge = '';
                    if (data.status === 'Win') statusBadge = '<span class="bg-green-900 text-green-300 py-1 px-2 rounded-full text-xs border border-green-700">✅ Win</span>';
                    else if (data.status === 'Lose') statusBadge = '<span class="bg-red-900 text-red-300 py-1 px-2 rounded-full text-xs border border-red-700">❌ Lose</span>';
                    else if (data.status === 'Cancel') statusBadge = '<span class="bg-gray-600 text-gray-300 py-1 px-2 rounded-full text-xs border border-gray-500">🚫 Cancel</span>';
                    else statusBadge = '<span class="bg-yellow-900 text-yellow-300 py-1 px-2 rounded-full text-xs border border-yellow-700">⏳ Pending</span>';

                    html += `
                        <tr class="border-b border-gray-700 hover:bg-gray-750 transition group">
                            <td class="px-4 py-3 whitespace-nowrap">${data.tglAnalisis}<br><span class="text-gray-400 text-xs">${data.jamAnalisis}</span></td>
                            <td class="px-4 py-3">${data.mesin}</td>
                            <td class="px-4 py-3 font-bold text-blue-400 uppercase">${data.coin}</td>
                            <td class="px-4 py-3">${data.entry}</td>
                            <td class="px-4 py-3 text-green-400">${data.tp}</td>
                            <td class="px-4 py-3 text-red-400">${data.sl}</td>
                            <td class="px-4 py-3 min-w-[150px]">${data.alasan}</td>
                            <td class="px-4 py-3 whitespace-nowrap">${data.tglHasil || '-'}<br><span class="text-gray-400 text-xs">${data.jamHasil || ''}</span></td>
                            <td class="px-4 py-3 whitespace-nowrap">${statusBadge}</td>
                            <td class="px-4 py-3 text-center whitespace-nowrap">
                                <button onclick="window.editTrade('${id}')" class="text-blue-400 hover:text-blue-300 font-bold">✏️ Edit</button>
                            </td>
                        </tr>
                    `;
                });

                if (globalTrades.length === 0) {
                    html = `<tr><td colspan="10" class="text-center py-4 text-gray-400">Belum ada riwayat trading.</td></tr>`;
                }
                document.getElementById('tableBody').innerHTML = html;
            } catch (error) {
                console.error("Error loading data:", error);
                
                if (error.code === 'permission-denied') {
                    document.getElementById('tableBody').innerHTML = `<tr><td colspan="10" class="text-center py-4 text-red-400 font-bold">Akses Ditolak! 🛑<br>Email ini tidak memiliki izin untuk membaca/menulis database sesuai aturan yang ditetapkan di Firebase.</td></tr>`;
                } else {
                    document.getElementById('tableBody').innerHTML = `<tr><td colspan="10" class="text-center py-4 text-red-400">Gagal memuat data. Periksa koneksi internet.</td></tr>`;
                }
            }
        }

        // Simpan Data (Baru & Edit)
        document.getElementById('journalForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = "Menyimpan... ⏳";
            btn.disabled = true;

            const tradeData = {
                mesin: document.getElementById('mesin').value,
                coin: document.getElementById('coin').value.toUpperCase(),
                tglAnalisis: document.getElementById('tglAnalisis').value,
                jamAnalisis: document.getElementById('jamAnalisis').value,
                entry: parseFloat(document.getElementById('entry').value),
                tp: parseFloat(document.getElementById('tp').value),
                sl: parseFloat(document.getElementById('sl').value),
                alasan: document.getElementById('alasan').value,
                tglHasil: document.getElementById('tglHasil').value,
                jamHasil: document.getElementById('jamHasil').value,
                status: document.getElementById('status').value,
                timestamp: document.getElementById('editId').value ? globalTrades.find(t => t.id === document.getElementById('editId').value).timestamp : new Date().getTime()
            };

            const editId = document.getElementById('editId').value;

            try {
                if (editId) {
                    await updateDoc(doc(db, "trades", editId), tradeData); 
                } else {
                    await addDoc(collection(db, "trades"), tradeData); 
                }
                
                window.resetForm();
                await loadData();
            } catch (error) {
                console.error("Error saving doc: ", error);
                if (error.code === 'permission-denied') {
                    alert("Gagal: Email ini tidak diizinkan untuk menyimpan data oleh aturan Firebase Anda.");
                } else {
                    alert("Gagal menyimpan data!");
                }
            } finally {
                btn.innerHTML = "Simpan Jurnal";
                btn.disabled = false;
            }
        });

        // Fitur klik tombol Edit
        window.editTrade = (id) => {
            const trade = globalTrades.find(t => t.id === id);
            if (!trade) return;

            document.getElementById('editId').value = trade.id;
            document.getElementById('mesin').value = trade.mesin;
            document.getElementById('coin').value = trade.coin;
            document.getElementById('tglAnalisis').value = trade.tglAnalisis;
            document.getElementById('jamAnalisis').value = trade.jamAnalisis;
            document.getElementById('entry').value = trade.entry;
            document.getElementById('tp').value = trade.tp;
            document.getElementById('sl').value = trade.sl;
            document.getElementById('alasan').value = trade.alasan;
            document.getElementById('tglHasil').value = trade.tglHasil || '';
            document.getElementById('jamHasil').value = trade.jamHasil || '';
            document.getElementById('status').value = trade.status || 'Pending';

            document.getElementById('formTitle').innerText = `✏️ Edit Analisis: ${trade.coin}`;
            document.getElementById('btnCancel').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetForm = () => {
            document.getElementById('journalForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('status').value = 'Pending';
            document.getElementById('formTitle').innerText = 'Tambah Analisis Baru';
            document.getElementById('btnCancel').classList.add('hidden');
        };

        // Fitur Export Excel
        window.exportExcel = () => {
            if (globalTrades.length === 0) {
                alert("Belum ada data untuk di-download!");
                return;
            }

            const excelData = globalTrades.map(trade => ({
                "Mesin": trade.mesin,
                "Coin": trade.coin,
                "Tanggal Analisis": trade.tglAnalisis,
                "Jam Analisis": trade.jamAnalisis,
                "Entry Limit": trade.entry,
                "Target TP": trade.tp,
                "Target SL": trade.sl,
                "Alasan": trade.alasan,
                "Tanggal Hasil": trade.tglHasil || "-",
                "Jam Hasil": trade.jamHasil || "-",
                "Status": trade.status
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            
            worksheet['!cols'] = [
                { wch: 10 }, { wch: 15 }, { wch: 15 }, { wch: 12 }, 
                { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 40 },
                { wch: 15 }, { wch: 12 }, { wch: 10 }
            ];

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Jurnal_Trading");

            const dateStr = new Date().toISOString().split('T')[0];
            XLSX.writeFile(workbook, `Jurnal_Crypto_${dateStr}.xlsx`);
        };
    </script>
</body>
</html>
